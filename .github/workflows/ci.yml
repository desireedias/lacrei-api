name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-test-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: lacrei_user
          POSTGRES_PASSWORD: lacrei_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lacrei_user -d lacrei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: lacrei_user
      POSTGRES_PASSWORD: lacrei_password

      DJANGO_SECRET_KEY: github-actions-test-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.create true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Check Django configuration
        run: poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run Ruff lint
        run: poetry run ruff check .

      - name: Check Ruff formatting
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run python manage.py test

      - name: Build Docker image
        run: docker build -t lacrei-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: lint-test-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      EB_APPLICATION_NAME: lacrei-api
      EB_ENVIRONMENT_NAME: Lacrei-api-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment package
        run: |
          git archive \
            --format=zip \
            --output=deploy.zip \
            HEAD \
            -- . ':(exclude)docker-compose.yml'

      - name: Get Elastic Beanstalk bucket
        id: eb-bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EB_BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"

          echo "bucket=${EB_BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Upload package to S3
        env:
          EB_BUCKET: ${{ steps.eb-bucket.outputs.bucket }}
        run: |
          VERSION_LABEL="staging-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          S3_KEY="lacrei-api/${VERSION_LABEL}.zip"

          aws s3 cp deploy.zip "s3://${EB_BUCKET}/${S3_KEY}"

          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"
          echo "S3_KEY=${S3_KEY}" >> "$GITHUB_ENV"

      - name: Create Elastic Beanstalk application version
        env:
          EB_BUCKET: ${{ steps.eb-bucket.outputs.bucket }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${EB_BUCKET}",S3Key="${S3_KEY}"

      - name: Deploy to Elastic Beanstalk staging
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${VERSION_LABEL}"

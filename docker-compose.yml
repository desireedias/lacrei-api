services:
  db:
    image: postgres:15-alpine
    container_name: lacrei_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lacrei_db}
      POSTGRES_USER: ${POSTGRES_USER:-lacrei_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacrei_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lacrei_user} -d ${POSTGRES_DB:-lacrei_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lacrei_api
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lacrei_db}
      POSTGRES_USER: ${POSTGRES_USER:-lacrei_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacrei_pass}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

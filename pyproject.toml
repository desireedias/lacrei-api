[project]
name = "lacrei-api"
version = "0.1.0"
description = ""
authors = [
    {name = "desireedias",email = "desireerdias@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]

[tool.ruff]
exclude = [
    "*/migrations/*",
]
[tool.ruff.lint]
ignore = ["RUF012"]